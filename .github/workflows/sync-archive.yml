name: Sync archive

on:
  schedule:
    # Every Sunday at 04:00 UTC (09:30 IST)
    - cron: '0 4 * * 0'
    # ONE-OFF x2: 7 September — unattended runs to watch. Two slots because
    # GitHub's scheduler is best-effort and already dropped a 09:30 UTC slot
    # today; the second is a fallback. Odd minutes dodge peak contention.
    # Remove both once one has fired.
    - cron: '18 11 7 9 *'
    - cron: '37 11 7 9 *'
  workflow_dispatch:
    # Manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: archive-discovery

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The --since flag reads .ingest-cache.jsonl to know which videos are
      # already indexed. That file is ~400 MB and can't live in the repo. Without
      # it, --since treats ALL videos as new and re-fetches 20,000 of them,
      # replacing the full 108K archive. This step builds a minimal stub cache
      # from the existing archive — just enough for knownVideoIds() to skip them.
      - name: Seed cache from existing archive
        run: |
          node -e "
            const { gunzipSync } = require('zlib');
            const { readFileSync, writeFileSync } = require('fs');
            const gz = readFileSync('data/index.json.gz');
            const archive = JSON.parse(gunzipSync(gz).toString());
            const lines = archive.clips.map(c =>
              JSON.stringify({ snippet: { resourceId: { videoId: c.id } } })
            );
            writeFileSync('data/.ingest-cache.jsonl', lines.join('\n') + '\n');
            console.log(archive.clips.length + ' known IDs written to stub cache.');
          "

      - name: Incremental ingest
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: npx tsx scripts/ingest.ts --since

      - name: Compress archive
        run: npm run pack-archive

      # Guards on CLIP COUNT, not byte size. Compressed size moves with JSON
      # formatting and gzip settings — a compactly serialised archive gzips
      # smaller while holding MORE clips — so bytes flag false losses. The count
      # is the invariant that actually matters.
      - name: Guard against archive shrinkage
        run: |
          git show HEAD:data/index.json.gz > /tmp/head.json.gz
          node -e "
            const { gunzipSync } = require('zlib');
            const { readFileSync } = require('fs');
            const count = (f) => JSON.parse(gunzipSync(readFileSync(f)).toString()).clips.length;
            const oldN = count('/tmp/head.json.gz');
            const newN = count('data/index.json.gz');
            console.log(\`Old: \${oldN.toLocaleString()} clips → New: \${newN.toLocaleString()} clips\`);
            if (newN < oldN) {
              console.log(\`::error::New archive (\${newN} clips) has fewer clips than current (\${oldN}). Aborting to prevent data loss.\`);
              process.exit(1);
            }
          "

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/index.json.gz
          if git diff --cached --quiet; then
            echo "No new videos — nothing to commit."
          else
            git commit -m "Sync archive: new uploads as of $(date -u +%Y-%m-%d)"
            git push
            echo "Pushed updated archive."
          fi
