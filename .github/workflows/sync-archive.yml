name: Sync archive

on:
  schedule:
    # Every Sunday at 04:00 UTC (09:30 IST)
    - cron: '0 4 * * 0'
  workflow_dispatch:
    # Manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: archive-discovery

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The --since flag reads .ingest-cache.jsonl to know which videos are
      # already indexed. That file is ~400 MB and can't live in the repo. Without
      # it, --since treats ALL videos as new and re-fetches 20,000 of them,
      # replacing the full 108K archive. This step builds a minimal stub cache
      # from the existing archive — just enough for knownVideoIds() to skip them.
      - name: Seed cache from existing archive
        run: |
          node -e "
            const { gunzipSync } = require('zlib');
            const { readFileSync, writeFileSync } = require('fs');
            const gz = readFileSync('data/index.json.gz');
            const archive = JSON.parse(gunzipSync(gz).toString());
            const lines = archive.clips.map(c =>
              JSON.stringify({ snippet: { resourceId: { videoId: c.id } } })
            );
            writeFileSync('data/.ingest-cache.jsonl', lines.join('\n') + '\n');
            console.log(archive.clips.length + ' known IDs written to stub cache.');
          "

      - name: Incremental ingest
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: npx tsx scripts/ingest.ts --since

      - name: Compress archive
        run: npm run pack-archive

      - name: Guard against archive shrinkage
        run: |
          OLD=$(git show HEAD:data/index.json.gz | wc -c | tr -d ' ')
          NEW=$(wc -c < data/index.json.gz | tr -d ' ')
          echo "Old: ${OLD} bytes → New: ${NEW} bytes"
          if [ "$NEW" -lt "$OLD" ]; then
            echo "::error::New archive ($NEW bytes) is smaller than current ($OLD bytes). Aborting to prevent data loss."
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/index.json.gz
          if git diff --cached --quiet; then
            echo "No new videos — nothing to commit."
          else
            git commit -m "Sync archive: new uploads as of $(date -u +%Y-%m-%d)"
            git push
            echo "Pushed updated archive."
          fi
